<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Devcord Installer — tasarım mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .installer{width:640px;max-width:100%;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.015));border:1px solid rgba(255,255,255,0.1);box-shadow:0 40px 100px rgba(0,0,0,0.6),0 0 60px rgba(61,74,192,0.18);backdrop-filter:blur(16px)}
  .inst-titlebar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(0,0,0,0.35);border-bottom:1px solid rgba(255,255,255,0.06)}
  .inst-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
  .inst-mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900;font-size:13px}
  .inst-controls{display:flex;gap:8px}
  .inst-controls span{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,0.15)}
  .inst-body{padding:32px 36px 28px}
  .inst-step{display:flex;gap:10px;margin-bottom:24px}
  .step{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden}
  .step.done{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .step.active{background:linear-gradient(90deg,var(--accent),var(--accent2));position:relative}
  .step.active::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);animation:shimmer 1.6s linear infinite}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .inst-hero{display:flex;align-items:center;gap:20px;margin-bottom:24px}
  .inst-icon{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:34px;box-shadow:0 0 40px var(--glow);animation:levitate 4s ease-in-out infinite}
  .inst-hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .inst-hero p{color:var(--muted);font-size:14px}
  .inst-list{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px 16px;margin-bottom:20px}
  .inst-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:14px}
  .inst-row + .inst-row{border-top:1px solid rgba(255,255,255,0.05)}
  .inst-row .label{color:var(--muted)}
  .inst-row .value{font-weight:600}
  .inst-check{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
  .inst-check input{accent-color:var(--accent);width:16px;height:16px}
  .inst-progress{height:8px;border-radius:8px;background:rgba(255,255,255,0.08);overflow:hidden;margin:18px 0 10px}
  .inst-progress .bar{height:100%;width:62%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px;position:relative}
  .inst-progress .bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);animation:shimmer 1.8s linear infinite}
  .inst-status{font-size:13px;color:var(--muted);margin-bottom:20px}
  .inst-actions{display:flex;justify-content:space-between;gap:12px}
  .inst-actions .btn{min-width:110px}
  .inst-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,0.06);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
  @media(prefers-reduced-motion:reduce){.inst-icon,.step.active::after,.inst-progress .bar::after{animation:none}}
</style>
</head>
<body>
<div class="bg-blobs" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
</div>
<div class="installer">
  <div class="inst-titlebar">
    <div class="inst-title"><span class="inst-mark">D</span> Devcord Installer</div>
    <div class="inst-controls"><span></span><span></span><span></span></div>
  </div>
  <div class="inst-body">
    <div class="inst-step">
      <div class="step done"></div><div class="step done"></div><div class="step active"></div><div class="step"></div><div class="step"></div>
    </div>
    <div class="inst-hero">
      <div class="inst-icon">📦</div>
      <div>
        <h2>Devcord kuruluyor</h2>
        <p>Discord istemcisine Devcord modu enjekte ediliyor. Lütfen bekleyin.</p>
      </div>
    </div>
    <div class="inst-list">
      <div class="inst-row"><span class="label">Hedef</span><span class="value">Discord (Stable)</span></div>
      <div class="inst-row"><span class="label">Konum</span><span class="value">C:\Users\…\AppData\Local\Discord</span></div>
      <div class="inst-row"><span class="label">Sürüm</span><span class="value">4.1.0</span></div>
      <div class="inst-row"><span class="label">Eklenti</span><span class="value">499 paket</span></div>
    </div>
    <div class="inst-progress"><div class="bar"></div></div>
    <div class="inst-status">Dosyalar kopyalanıyor… 62%</div>
    <div class="inst-check"><input type="checkbox" checked id="c1"><label for="c1">Kurulum bitince Discord'u başlat</label></div>
    <div class="inst-check"><input type="checkbox" id="c2"><label for="c2">Masaüstü kısayolu oluştur</label></div>
    <div class="inst-actions">
      <button class="btn btn-ghost">İptal</button>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost">Geri</button>
        <button class="btn btn-primary">Devam</button>
      </div>
    </div>
  </div>
  <div class="inst-foot">
    <span>GPL-3.0 · Açık kaynak</span>
    <span>github.com/Devcord/Devcord</span>
  </div>
</div>
</body>
</html>
